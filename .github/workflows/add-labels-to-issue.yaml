name: add labels to issue

on:
  workflow_call:
    secrets:
      ORG_MEMBERSHIP_TOKEN:
        required: false
      MEMBERS:
        required: false
      SLACK_BOT_TOKEN:
        required: false
      SLACK_CHANNEL:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions: {}

jobs:
  add-customer-submission-label:
    name: add customer-submission label
    permissions:
      issues: write
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Add customer-submission label
        if: ${{ env.MEMBER == 'false' }}
        uses: andymckay/labeler@e6c4322d0397f3240f0e7e30a33b5c5df2d39e90 # 1.0.4
        with:
          add-labels: "customer-submission"
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_MEMBERSHIP_TOKEN || github.token }}
          MEMBER: ${{ contains( secrets.MEMBERS, github.actor ) }}

      - name: Notify Slack on failure
        if: >-
          (failure() || cancelled())
          && (env.SLACK_BOT_TOKEN != '' || env.SLACK_WEBHOOK_URL != '')
        uses: senzing-factory/build-resources/slack-failure-notification@1c63e59ff80665ed92f14f3114e66e30c7659b31 # 4.10.0
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  add-triage-label:
    name: add triage label
    permissions:
      issues: write
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: add triage label
        uses: andymckay/labeler@e6c4322d0397f3240f0e7e30a33b5c5df2d39e90 # 1.0.4
        with:
          add-labels: "triage"

      - name: Notify Slack on failure
        if: >-
          (failure() || cancelled())
          && (env.SLACK_BOT_TOKEN != '' || env.SLACK_WEBHOOK_URL != '')
        uses: senzing-factory/build-resources/slack-failure-notification@1c63e59ff80665ed92f14f3114e66e30c7659b31 # 4.10.0
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
