name: lint workflows

on:
  workflow_call:
    inputs:
      default-branch:
        default: main
        description: "Default branch of the repository"
        required: false
        type: string
      validate-all-codebase:
        default: false
        description: "Lint all files or only modified: true/false."
        required: false
        type: boolean

permissions: {}

jobs:
  # In order to require linting as a status check we need to
  # run the overall workflow on every pr.
  # This is used to skip at the job level if there are no
  # changes to the files the linter is scoped to.
  # The filter below must stay in step with FILTER_REGEX_INCLUDE
  # in the lint-workflows job: a gate narrower than that scope
  # silently hides files super-linter is configured to lint --
  # composite actions under .github/actions/ were never linted this way.
  changes:
    runs-on: ubuntu-latest
    outputs:
      dot-github: ${{ steps.changes.outputs.dot-github }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            dot-github:
              - '.github/**'

  lint-workflows:
    if: ${{ needs.changes.outputs.dot-github == 'true' }}
    name: lint workflows
    needs: changes
    # super-linter's own default, pinned here so the step below and
    # super-linter cannot disagree about where checkov's config is read from.
    env:
      LINTER_RULES_PATH: .github/linters
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # super-linter invokes checkov as a tree scanner, not per file, so
      # FILTER_REGEX_INCLUDE below never reaches it and a workflow named
      # "lint workflows" fails on findings the pull request never touched.
      # checkov reads its config from inside the caller's checkout, so the
      # runner workspace is the only place a reusable workflow can set it.
      # The allowlist keeps the CI-configuration frameworks and drops the
      # ones that walk the whole repository.
      - name: scope checkov to ci configuration frameworks
        run: |
          checkov_config="${LINTER_RULES_PATH}/.checkov.yaml"
          if [ -e "${checkov_config}" ]; then
            echo "${checkov_config} exists here; leaving it alone"
            exit 0
          fi
          mkdir -p "$(dirname "${checkov_config}")"
          {
            echo "---"
            echo "quiet: true"
            echo "framework:"
            echo "  - github_actions"
            echo "  - dockerfile"
            echo "  - gitlab_ci"
          } > "${checkov_config}"
          cat "${checkov_config}"

      - name: lint code base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_INCLUDE: .*\.github/.*
          FIX_BIOME_FORMAT: false
          FIX_BIOME_LINT: false
          # only lint new and modified files
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate-all-codebase }}
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_CLANG_FORMAT: false
          VALIDATE_CPP: false
          VALIDATE_DOCKERFILE_HADOLINT: false
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_GO_RELEASER: false
          VALIDATE_GOOGLE_JAVA_FORMAT: false
          VALIDATE_JAVA: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          VALIDATE_RUST_2015: false
          VALIDATE_RUST_2018: false
          VALIDATE_RUST_2021: false
          VALIDATE_RUST_CLIPPY: false
          VALIDATE_SHELL_SHFMT: false
