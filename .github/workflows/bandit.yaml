name: Bandit

on:
  workflow_call:
    inputs:
      python-version:
        default: "3.13"
        description: Python version to use for running Bandit
        required: false
        type: string
      targets:
        default: src
        description: Space-separated list of directories to scan
        required: false
        type: string
      config-file:
        default: ""
        description: Config file to read. Empty means none. A pyproject.toml
          with no [tool.bandit] section is accepted and silently ignored.
        required: false
        type: string

permissions: {}

jobs:
  bandit:
    name: Bandit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Bandit
        env:
          BANDIT_TARGETS: ${{ inputs.targets }}
          BANDIT_CONFIG_FILE: ${{ inputs.config-file }}
        run: |
          # Python 3.11 and later read TOML natively; the extra covers 3.9/3.10.
          pip install 'bandit[toml]'
          IFS=' ' read -ra targets <<< "$BANDIT_TARGETS"
          args=(-r "${targets[@]}")
          [ -n "$BANDIT_CONFIG_FILE" ] && args=(-c "$BANDIT_CONFIG_FILE" "${args[@]}")
          bandit "${args[@]}"
