name: go coverage

on:
  workflow_call:
    inputs:
      coverage-config:
        default: "./.testcoverage.yml"
        description: Path to coverage config, relative to the github workspace.
        required: false
        type: string
      profile:
        default: "cover.out"
        description: Path to coverage profile file.
        required: false
        type: string

permissions: {}

jobs:
  go-coverage:
    name: go coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        with:
          pattern: cover*
          merge-multiple: true

      - name: check test coverage
        uses: vladopajic/go-test-coverage@f484eec846448c97c777a26f8b58c5a69a327e12 # v2.20.0
        with:
          config: ${{ inputs.coverage-config }}
          profile: ${{ inputs.profile }}
