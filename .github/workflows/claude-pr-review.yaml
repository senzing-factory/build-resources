name: Claude PR Review

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  review:
    # Pinned to an exact tag, not the floating @v4. `v4` is parked on the
    # rolled-back 4.5.1, so this repository has been reviewing its own changes
    # to the reviewer with a version from before every rewrite -- including
    # the two most recent, which it therefore never exercised.
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@35bd53b01ab78531dfc265f8b547fd9d218c67c7 # 4.10.3
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
