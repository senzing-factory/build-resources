name: Claude PR Review

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  review:
    # TEMPORARY, MUST NOT MERGE. Pinned to this pull request's own branch so
    # the change under review IS the reviewer reviewing it -- 18 changed files,
    # above the count where coverage was measured to collapse. Revert before
    # merge: `main` must never carry a branch ref. Permanent fix is #365.
    uses: senzing-factory/build-resources/.github/workflows/claude-pull-request-review.yaml@385-skern
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
